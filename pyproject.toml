[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vertfrac"
version = "0.2.0"
description = "Automatic vertebrae fracture screening (chest CT): segmentation, SupCon Genant grading, Grad-CAM"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
