# All paths are relative to the repo root.
data:
  verse_root: data/verse            # unzip the verse19/verse20 zips in here
  grades_csv: data/grades.csv       # subject,vert_label,grade  (see docs/ROADMAP.md, step 1.3)
  roi_dir: data/rois
  manifest: data/manifest.csv
preprocess:
  spacing_mm: 1.0                   # isotropic resample
  hu_min: -200                      # bone-ish window; tune in ablation
  hu_max: 1000
  roi_size: 96                      # sagittal crop (pixels @ spacing_mm)
  slice_offsets_mm: [-3, 0, 3]      # 2.5D: 3 sagittal slices -> 3 channels
splits:
  n_folds: 5
  seed: 42
  test_fold: 0                      # fold held out as final test
  val_fold: 1
model:
  backbone: hf:microsoft/resnet-50   # HF ResNet-50. Alternatives: resnet50 (torchvision) | hf-hub:timm/resnet50.a1_in1k | efficientnet_b0
  pretrained: true
  embed_dim: 128
  num_classes: 4
train:
  epochs: 60
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-4
  lambda_supcon: 0.5                # set 0.0 for the baseline in the ablation
  temperature: 0.1
  class_weighted_ce: true
  focal_gamma: 0.0                  # >0 switches CE to focal loss
  balanced_sampling: true
  seed: 42
  out_dir: runs/supcon
seg:
  patch_size: [128, 128, 96]
  spacing_mm: 1.5
  epochs: 200
  batch_size: 2
  out_dir: runs/unet
